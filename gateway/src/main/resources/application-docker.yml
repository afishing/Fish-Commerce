server:
  port: 5000

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: nacos:8848
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: service-admin
          uri: lb://service-user
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        - id: service-user
          uri: lb://service-user
          predicates:
            - Path=/api/user/**,/api/auth/**
          filters:
            - StripPrefix=1

        - id: service-address
          uri: lb://service-user
          predicates:
            - Path=/api/address/**
          filters:
            - StripPrefix=1

        - id: service-product
          uri: lb://service-product
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1

        - id: service-order
          uri: lb://service-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        - id: service-cart
          uri: lb://service-cart
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1

        - id: service-pay
          uri: lb://service-pay
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1

        - id: service-product-static
          uri: lb://service-product
          predicates:
            - Path=/uploads/**

        - id: service-product-upload
          uri: lb://service-product
          predicates:
            - Path=/upload/**

        - id: service-video
          uri: lb://service-content
          predicates:
            - Path=/api/video/**
          filters:
            - StripPrefix=1

        - id: service-gallery
          uri: lb://service-content
          predicates:
            - Path=/api/gallery/**
          filters:
            - StripPrefix=1

        - id: service-notice
          uri: lb://service-content
          predicates:
            - Path=/api/notice/**
          filters:
            - StripPrefix=1

        - id: service-category
          uri: lb://service-product
          predicates:
            - Path=/api/category/**
          filters:
            - StripPrefix=1

        - id: service-tag
          uri: lb://service-product
          predicates:
            - Path=/api/tag/**
          filters:
            - StripPrefix=1

        - id: service-monitor
          uri: lb://monitor
          predicates:
            - Path=/api/monitor/**
          filters:
            - StripPrefix=1

        - id: service-ai
          uri: lb://service-ai
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1
          metadata:
            response-timeout: 120000
            connect-timeout: 10000

  data:
    redis:
      host: redis
      port: 6379

spring.cloud.sentinel:
  transport:
    dashboard: monitor:8080
  eager: true

logging:
  level:
    org.springframework.cloud.gateway: INFO
    com.alibaba.nacos: INFO

gateway:
  timeout:
    connect: 3000
    response: 10000
