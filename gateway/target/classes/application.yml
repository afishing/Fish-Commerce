server:
  port: 5000

spring:
  application:
    name: gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
    gateway:
      # 服务发现路由定位器，自动根据服务名路由
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      # 路由配置
      routes:
        # 管理员服务路由（放在前面优先匹配）
        - id: service-admin
          uri: lb://service-user
          predicates:
            - Path=/api/admin/**
          filters:
            - StripPrefix=1

        # 用户服务路由
        - id: service-user
          uri: lb://service-user
          predicates:
            - Path=/api/user/**,/api/auth/**
          filters:
            - StripPrefix=1

        # 地址服务路由（在service-user中）
        - id: service-address
          uri: lb://service-user
          predicates:
            - Path=/api/address/**
          filters:
            - StripPrefix=1

        # 商品服务路由
        - id: service-product
          uri: lb://service-product
          predicates:
            - Path=/api/product/**
          filters:
            - StripPrefix=1

        # 订单服务路由
        - id: service-order
          uri: lb://service-order
          predicates:
            - Path=/api/order/**
          filters:
            - StripPrefix=1

        # 购物车服务路由
        - id: service-cart
          uri: lb://service-cart
          predicates:
            - Path=/api/cart/**
          filters:
            - StripPrefix=1

        # 支付服务路由
        - id: service-pay
          uri: lb://service-pay
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=1

        # 静态资源路由（图片访问）
        - id: service-product-static
          uri: lb://service-product
          predicates:
            - Path=/uploads/**

        # 文件上传路由
        - id: service-product-upload
          uri: lb://service-product
          predicates:
            - Path=/upload/**

        # 视频服务路由
        - id: service-video
          uri: lb://service-video
          predicates:
            - Path=/video/**

        # 公告服务路由（在service-product中）
        - id: service-notice
          uri: lb://service-product
          predicates:
            - Path=/api/notice/**
          filters:
            - StripPrefix=1

        # 标签服务路由（在service-product中）
        - id: service-tag
          uri: lb://service-product
          predicates:
            - Path=/api/tag/**
          filters:
            - StripPrefix=1

        # AI服务路由
        - id: service-ai
          uri: lb://service-ai
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1

  # Redis 配置（用于限流）
  data:
    redis:
      host: localhost
      port: 6379

# Sentinel 控制台配置
spring.cloud.sentinel:
  transport:
    dashboard: localhost:8080
  eager: true

# 日志级别
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    com.alibaba.nacos: INFO

# 网关全局配置
gateway:
  # 请求超时配置
  timeout:
    connect: 3000
    response: 10000
