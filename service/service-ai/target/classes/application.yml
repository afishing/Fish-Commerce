server:
  port: 9100

spring:
  application:
    name: service-ai
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  ai:
    openai:
      # 请将 api-key 替换为实际的 OpenAI API Key
      # 如使用代理，修改 base-url 为代理地址
      api-key: sk-07b8fc3197ec4bb8a39371797e98a551
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-chat

# Actuator 配置
management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    info:
      enabled: true
  info:
    env:
      enabled: true
